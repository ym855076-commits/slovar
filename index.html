<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Словарь жестового языка | Žest dili sözlügi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        header { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .school-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 5px; }
        .author-badge { display: inline-block; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 8px; }
        h1 { font-size: 24px; color: var(--accent); margin: 15px 0; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 15px; }
        button { background: var(--border); color: var(--text-main); border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        button:hover { background: var(--accent); color: #fff; }
        button.active { background: var(--accent); color: #fff; }
        .search-box { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-color); color: var(--text-main); font-size: 16px; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: thin; }
        .cat-btn { white-space: nowrap; background: var(--card-bg); border: 1px solid var(--border); }
        .cat-btn.active { background: var(--accent); border-color: var(--accent); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .word-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .word-number { font-size: 12px; color: var(--text-muted); text-align: center; }
        .word-title { font-size: 18px; font-weight: bold; text-align: center; color: var(--text-main); }
        .media-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .media-box.single { grid-template-columns: 1fr; }
        .media-slot { background: var(--bg-color); border: 2px dashed var(--border); border-radius: 8px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; cursor: pointer; }
        .media-slot img, .media-slot video { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .media-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .hidden-input { display: none; }
        .action-row { display: flex; gap: 5px; }
        .action-row button { flex: 1; font-size: 11px; padding: 6px; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; align-items: center; text-align: center; }
        .qr-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .qr-img { width: 160px; height: 160px; border-radius: 8px; background: #fff; padding: 5px; object-fit: contain; cursor: pointer; transition: transform 0.2s; }
        .qr-img:hover { transform: scale(1.03); }
        footer { text-align: center; font-size: 13px; color: var(--text-muted); padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="school-title">Türkmenistanyň Bilim ministrligi • Ýöriteleşdirilen mekdep-internaty</div>
        <div class="author-badge">👑 Awtor / Terbiýeçi: Mürzaýew Ýusup</div>
        <h1 id="main-title">Словарь жестового языка</h1>
        <div class="controls">
            <button onclick="toggleLang()" id="lang-btn">🌐 TM / RU</button>
            <button onclick="openWordOfTheDay()">🎲 <span id="lbl-wotd">Слово дня</span></button>
            <button onclick="openQuiz()">🎮 <span id="lbl-quiz">Тест</span></button>
            <button onclick="openConstructor()">🧩 <span id="lbl-const">Буквы</span></button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="Поиск слова..." oninput="filterWords()">
    </header>

    <div class="categories" id="categoriesContainer"></div>
    <div class="cards-grid" id="cardsGrid"></div>

    <div class="qr-section">
        <h3 id="lbl-share">Поделиться словарем</h3>
        <img src="qrcode.png" alt="QR-код" class="qr-img" onclick="openQrModal()" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\'><rect width=\'100%\' height=\'100%\' fill=\'%23fff\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23333\' font-size=\'14\'>qrcode.png ýok</text></svg>'">
        <p style="font-size: 13px; color: var(--text-muted);" id="lbl-qr-hint">Нажмите на QR-код для увеличения</p>
    </div>

    <footer>Mürzaýew Ýusup © 2026 • Hemme hukuklar goralan</footer>
</div>

<div class="modal" id="modalWindow" onclick="if(event.target === this) closeModal()">
    <div class="modal-content" id="modalBody"></div>
</div>

<script>
    let currentLang = 'ru';
    let currentCat = 0;

    const data = [
        {
            isAlphabet: true,
            catName: { ru: "1. Дактиль (Алфавит)", tm: "1. Daktil (Elipbiý)" },
            words: [
                { id: 1, ru: "Буква А", tm: "A harp" }, { id: 2, ru: "Буква Б", tm: "B harp" },
                { id: 3, ru: "Буква В", tm: "V harp" }, { id: 4, ru: "Буква Г", tm: "G harp" },
                { id: 5, ru: "Буква Д", tm: "D harp" }, { id: 6, ru: "Буква Е", tm: "E harp" },
                { id: 7, ru: "Буква Ё", tm: "Ýo harp" }, { id: 8, ru: "Буква Ж", tm: "Ž harp" },
                { id: 9, ru: "Буква З", tm: "Z harp" }, { id: 10, ru: "Буква И", tm: "I harp" },
                { id: 11, ru: "Буква Й", tm: "Ý harp" }, { id: 12, ru: "Буква К", tm: "K harp" },
                { id: 13, ru: "Буква Л", tm: "L harp" }, { id: 14, ru: "Буква М", tm: "M harp" },
                { id: 15, ru: "Буква Н", tm: "N harp" }, { id: 16, ru: "Буква О", tm: "O harp" },
                { id: 17, ru: "Буква П", tm: "P harp" }, { id: 18, ru: "Буква Р", tm: "R harp" },
                { id: 19, ru: "Буква С", tm: "S harp" }, { id: 20, ru: "Буква Т", tm: "T harp" },
                { id: 21, ru: "Буква У", tm: "U harp" }, { id: 22, ru: "Буква Ф", tm: "F harp" },
                { id: 23, ru: "Буква Х", tm: "H harp" }, { id: 24, ru: "Буква Ц", tm: "S harp" },
                { id: 25, ru: "Буква Ч", tm: "Ç harp" }, { id: 26, ru: "Буква Ш", tm: "Ş harp" },
                { id: 27, ru: "Буква Щ", tm: "Ş harp" }, { id: 28, ru: "Буква Ъ", tm: "Gatylaşdyryjy" },
                { id: 29, ru: "Буква Ы", tm: "Y harp" }, { id: 30, ru: "Буква Ь", tm: "Ýumşadyjy" },
                { id: 31, ru: "Буква Э", tm: "E harp" }, { id: 32, ru: "Буква Ю", tm: "Ýu harp" },
                { id: 33, ru: "Буква Я", tm: "Ýa harp" }
            ]
        },
        {
            isAlphabet: false,
            catName: { ru: "2. Приветствия", tm: "2. Salamlaşmak" },
            words: [
                { id: 34, ru: "Здравствуйте", tm: "Salam" }, { id: 35, ru: "Доброе утро", tm: "Ertiriňiz hayyrly bolsun" },
                { id: 36, ru: "Добрый день", tm: "Günüňiz haýyrly bolsun" }, { id: 37, ru: "Добрый вечер", tm: "Agşamyňyz haýyrly bolsun" },
                { id: 38, ru: "Привет", tm: "Salam" }, { id: 39, ru: "Как дела?", tm: "Ýagdaýlaryňyz neneňçi?" },
                { id: 40, ru: "Спасибо", tm: "Sag boluň" }, { id: 41, ru: "Пожалуйста", tm: "Hoşalyk" },
                { id: 42, ru: "До свидания", tm: "Sag boluň" }, { id: 43, ru: "Спокойной ночи", tm: "Gijäňiz rahat bolsun" }
            ]
        },
        {
            isAlphabet: false,
            catName: { ru: "3. Семья и люди", tm: "3. Maşgala" },
            words: [
                { id: 54, ru: "Мама", tm: "Eje" }, { id: 55, ru: "Папа", tm: "Kaka" },
                { id: 56, ru: "Семья", tm: "Maşgala" }, { id: 57, ru: "Сын", tm: "Oglul" },
                { id: 58, ru: "Дочь", tm: "Gyz" }, { id: 59, ru: "Брат", tm: "Dogan" }
            ]
        }
    ];

    let userMedia = JSON.parse(localStorage.getItem('slovar_media') || '{}');

    function init() {
        renderCategories();
        renderCards();
        updateTexts();
    }

    function toggleLang() {
        currentLang = currentLang === 'ru' ? 'tm' : 'ru';
        updateTexts();
        renderCategories();
        renderCards();
    }

    function updateTexts() {
        document.getElementById('main-title').innerText = currentLang === 'ru' ? 'Словарь жестового языка' : 'Žest dili sözlügi';
        document.getElementById('lang-btn').innerText = currentLang === 'ru' ? '🌐 TM / RU' : '🌐 RU / TM';
        document.getElementById('lbl-wotd').innerText = currentLang === 'ru' ? 'Слово дня' : 'Söz güni';
        document.getElementById('lbl-quiz').innerText = currentLang === 'ru' ? 'Тест' : 'Test';
        document.getElementById('lbl-const').innerText = currentLang === 'ru' ? 'Буквы' : 'Bukvasar';
        document.getElementById('lbl-share').innerText = currentLang === 'ru' ? 'Поделиться словарем' : 'Sözlügi paýlaşmak';
        document.getElementById('lbl-qr-hint').innerText = currentLang === 'ru' ? 'Нажмите на QR-код для увеличения' : 'Uly etmek üçin surata basyň';
        document.getElementById('searchInput').placeholder = currentLang === 'ru' ? 'Поиск слова...' : 'Söz gözlemek...';
    }

    function renderCategories() {
        const container = document.getElementById('categoriesContainer');
        container.innerHTML = '';
        data.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.className = `cat-btn ${index === currentCat ? 'active' : ''}`;
            btn.innerText = cat.catName[currentLang];
            btn.onclick = () => { currentCat = index; renderCards(); };
            container.appendChild(btn);
        });
    }

    function renderCards(filterText = '') {
        const grid = document.getElementById('cardsGrid');
        grid.innerHTML = '';
        
        let activeCat = data[currentCat];
        let wordsToRender = [];

        if(filterText) {
            data.forEach(cat => {
                cat.words.forEach(w => {
                    if(w.ru.toLowerCase().includes(filterText.toLowerCase()) || w.tm.toLowerCase().includes(filterText.toLowerCase())) {
                        wordsToRender.push({word: w, isAlphabet: cat.isAlphabet});
                    }
                });
            });
        } else {
            wordsToRender = activeCat.words.map(w => ({word: w, isAlphabet: activeCat.isAlphabet}));
        }

        if(wordsToRender.length === 0) {
            grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">${currentLang === 'ru' ? 'Ничего не найдено' : 'Hiç zat tapylmady'}</div>`;
            return;
        }

        wordsToRender.forEach(item => {
            const word = item.word;
            const isAlphabet = item.isAlphabet;
            const card = document.createElement('div');
            card.className = 'word-card';
            
            const media = userMedia[word.id] || { daktil: '', gest: '' };

            if (isAlphabet) {
                // Карточка для алфавита (Дактиль + Жест)
                card.innerHTML = `
                    <div class="word-number">№${word.id}</div>
                    <div class="word-title">${word[currentLang]}</div>
                    <div class="media-box">
                        <div class="media-slot" onclick="triggerUpload(${word.id}, 'daktil')">
                            ${media.daktil ? `<img src="${media.daktil}">` : `<span style="font-size:20px">📁</span><span class="media-label">Daktil</span>`}
                        </div>
                        <div class="media-slot" onclick="triggerUpload(${word.id}, 'gest')">
                            ${media.gest ? `<img src="${media.gest}">` : `<span style="font-size:20px">📁</span><span class="media-label">Žest</span>`}
                        </div>
                    </div>
                    <input type="file" id="file-${word.id}-daktil" class="hidden-input" accept="image/*,video/*" onchange="handleFile(event, ${word.id}, 'daktil')">
                    <input type="file" id="file-${word.id}-gest" class="hidden-input" accept="image/*,video/*" onchange="handleFile(event, ${word.id}, 'gest')">
                    <div class="action-row">
                        <button onclick="triggerUpload(${word.id}, 'daktil')">📂 Daktil</button>
                        <button onclick="triggerUpload(${word.id}, 'gest')">📂 Žest</button>
                    </div>
                    ${(media.daktil || media.gest) ? `<button class="btn-danger" onclick="deleteMedia(${word.id})">🗑️ ${currentLang === 'ru' ? 'Удалить' : 'Pozmak'}</button>` : ''}
                `;
            } else {
                // Карточка для остальных разделов (Один слот)
                card.innerHTML = `
                    <div class="word-number">№${word.id}</div>
                    <div class="word-title">${word[currentLang]}</div>
                    <div class="media-box single">
                        <div class="media-slot" onclick="triggerUpload(${word.id}, 'gest')">
                            ${media.gest ? `<img src="${media.gest}">` : `<span style="font-size:24px">📁</span><span class="media-label">${currentLang === 'ru' ? 'Выбрать файл' : 'Faýl saýla'}</span>`}
                        </div>
                    </div>
                    <input type="file" id="file-${word.id}-gest" class="hidden-input" accept="image/*,video/*" onchange="handleFile(event, ${word.id}, 'gest')">
                    <div class="action-row">
                        <button onclick="triggerUpload(${word.id}, 'gest')">📂 ${currentLang === 'ru' ? 'Загрузить' : 'Ýüklemek'}</button>
                    </div>
                    ${media.gest ? `<button class="btn-danger" onclick="deleteMedia(${word.id})">🗑️ ${currentLang === 'ru' ? 'Удалить' : 'Pozmak'}</button>` : ''}
                `;
            }
            grid.appendChild(card);
        });
    }

    function filterWords() {
        const query = document.getElementById('searchInput').value;
        renderCards(query);
    }

    function triggerUpload(id, type) {
        document.getElementById(`file-${id}-${type}`).click();
    }

    function handleFile(event, id, type) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            if(!userMedia[id]) userMedia[id] = { daktil: '', gest: '' };
            userMedia[id][type] = e.target.result;
            localStorage.setItem('slovar_media', JSON.stringify(userMedia));
            renderCards(document.getElementById('searchInput').value);
        };
        reader.readAsDataURL(file);
    }

    function deleteMedia(id) {
        if(userMedia[id]) {
            delete userMedia[id];
            localStorage.setItem('slovar_media', JSON.stringify(userMedia));
            renderCards(document.getElementById('searchInput').value);
        }
    }

    function openQrModal() {
        const modal = document.getElementById('modalWindow');
        const body = document.getElementById('modalBody');
        body.innerHTML = `
            <h2>${currentLang === 'ru' ? 'QR-код словаря' : 'Sözlügiň QR-kody'}</h2>
            <img src="qrcode.png" alt="QR-код" style="width: 260px; height: 260px; border-radius: 8px; background: #fff; padding: 10px; object-fit: contain;" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%23fff\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23333\' font-size=\'16\'>qrcode.png ýok</text></svg>'">
            <button onclick="closeModal()" style="background: var(--accent); color: #fff; width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold;">${currentLang === 'ru' ? 'Закрыть' : 'Ýapmak'}</button>
        `;
        modal.style.display = 'flex';
    }

    function openWordOfTheDay() {
        const allWords = data.flatMap(c => c.words);
        const randomWord = allWords[Math.floor(Math.random() * allWords.length)];
        const modal = document.getElementById('modalWindow');
        body = document.getElementById('modalBody');
        body.innerHTML = `
            <h2>🎲 ${currentLang === 'ru' ? 'Слово дня' : 'Günüň sözi'}</h2>
            <div style="font-size: 22px; font-weight: bold; color: var(--accent); margin: 20px 0;">${randomWord[currentLang]}</div>
            <button onclick="closeModal()" style="background: var(--accent); color: #fff; width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer;">OK</button>
        `;
        modal.style.display = 'flex';
    }

    function openQuiz() {
        const modal = document.getElementById('modalWindow');
        document.getElementById('modalBody').innerHTML = `<h2>🎮 Test</h2><p>Tez wagtdan işläp başlar...</p><button onclick="closeModal()" style="background:var(--accent); color:#fff; padding:8px 16px; border-radius:6px; border:none;">OK</button>`;
        modal.style.display = 'flex';
    }

    function openConstructor() {
        const modal = document.getElementById('modalWindow');
        document.getElementById('modalBody').innerHTML = `<h2>🧩 Bukvasar</h2><p>Tez wagtdan işläp başlar...</p><button onclick="closeModal()" style="background:var(--accent); color:#fff; padding:8px 16px; border-radius:6px; border:none;">OK</button>`;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalWindow').style.display = 'none';
    }

    window.onload = init;
</script>
</body>
</html>
